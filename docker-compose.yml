services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models

  front:
    build:
      context: .
      dockerfile: Dockerfile.front
    ports:
      - "8501:8501"
    volumes:
      - ./models:/app/models
    environment:
      - WATERFLOW_API=http://api:8000/api/predict
    depends_on:
      - api
